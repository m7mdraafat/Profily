services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: profily
      POSTGRES_PASSWORD: profily_dev_123
      POSTGRES_DB: profily
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profily"]
      interval: 20s
      timeout: 5s
      retries: 5
    
volumes:
  pgdata:
