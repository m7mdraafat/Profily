<!-- ===== CONTACT SECTION ===== -->
<section class="contact section" id="contact">
    <div class="section-container">
        <div class="section-header">
            <span class="section-subtitle">{{ sections.contact.subtitle }}</span>
            <h2 class="section-title">Contact <span class="gradient-text">Me</span></h2>
        </div>
        <div class="contact-grid">
            <div class="contact-info-col">
                <p class="contact-intro">
                    {{ sections.contact.description }}
                </p>
                <div class="contact-details">
                    {{ if profile.email }}
                    <div class="contact-detail-item glass-card" data-animate>
                        <div class="detail-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </div>
                        <div>
                            <h4>Email</h4>
                            <a href="mailto:{{ profile.email }}">{{ profile.email }}</a>
                        </div>
                    </div>
                    {{ end }}
                    {{ if profile.location }}
                    <div class="contact-detail-item glass-card" data-animate>
                        <div class="detail-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                        </div>
                        <div>
                            <h4>Location</h4>
                            <span>{{ profile.location }}</span>
                        </div>
                    </div>
                    {{ end }}
                    <div class="contact-detail-item glass-card" data-animate>
                        <div class="detail-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        </div>
                        <div>
                            <h4>Freelance</h4>
                            <span class="status-available">Available</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="contact-form-col">
                <form class="contact-form glass-card" id="contact-form">
                    <div class="form-group">
                        <input type="text" id="name" name="name" placeholder="Your Name" required autocomplete="name">
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="Your Email" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <input type="text" id="subject" name="subject" placeholder="Subject">
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">
                        <span>Send Message</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
