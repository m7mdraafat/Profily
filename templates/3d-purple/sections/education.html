<!-- ===== EDUCATION SECTION ===== -->
<section class="education section" id="education">
    <div class="section-container">
        <div class="section-header">
            <span class="section-subtitle">{{ sections.education.subtitle }}</span>
            <h2 class="section-title">My <span class="gradient-text">Education</span></h2>
        </div>
        <div class="education-grid">
            {{ for edu in education }}
            <div class="education-card glass-card" data-animate>
                <div class="education-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/>
                    </svg>
                </div>
                <h3 class="education-degree">{{ edu.degree }}</h3>
                <span class="education-school">{{ edu.school }}</span>
                <span class="education-date">
                    {{ edu.start_date }}{{ if edu.end_date }} — {{ edu.end_date }}{{ end }}
                </span>
                {{ if edu.description }}
                <p class="education-desc">{{ edu.description }}</p>
                {{ end }}
            </div>
            {{ end }}
        </div>
    </div>
</section>
